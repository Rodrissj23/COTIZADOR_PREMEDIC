name: Premedic Zeroka Control Pilot

on:
  push:
    branches:
      - zeroka-control-pilot
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run existing logic regression
        run: |
          node tests/qa.mjs
          node tests/tariff-structure.mjs
          node tests/formal-quote.mjs
          node tests/promociones-qa.mjs
          node tests/coverage-assets-qa.mjs
      - name: Run Zeroka Control pilot QA
        run: node tests/control-config-qa.mjs
      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.55.0 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/premedic-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/premedic-http.log
          exit 1
      - name: Run browser regression
        run: |
          node tests/browser-qa.mjs
          node tests/flash25-browser-qa.mjs
          node tests/pdf-official-qa.mjs
          node tests/login-browser.mjs
