name: Premedic QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run logic and security audit
        run: |
          node tests/qa.mjs
          node tests/tariff-structure.mjs
          node tests/formal-quote.mjs
          node tests/promociones-qa.mjs
      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/premedic-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/premedic-http.log
          exit 1
      - name: Run browser and PDF audit
        run: |
          node tests/browser-qa.mjs
          node tests/login-browser.mjs
      - name: Smoke test production
        run: node tests/prod-smoke.mjs
      - name: Capture visual QA artifacts
        run: node tests/visual-capture.mjs
      - name: Upload visual QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: premedic-visual-qa
          path: qa-artifacts/
          retention-days: 7
