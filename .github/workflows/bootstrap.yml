name: Bootstrap Cotizador Premedic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destino
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar base del cotizador
        run: |
          git clone --depth 1 https://github.com/GrupoZeroka/COTIZADOR_PREMEDIC.git /tmp/premedic-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/premedic-source/. .
          rm -rf .git
          mv /tmp/premedic-source/.git .git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git add -A
          git commit -m "Importar base Cotizador Premedic" || exit 0
          git push --force origin HEAD:main
